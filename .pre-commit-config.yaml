repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: '^\.dockg/'
      - id: debug-statements

  # Keep this rev in step with the `ruff` floor in pyproject's dev group.
  # A pre-commit rev that drifts from the version CI installs means two
  # different formatters over one tree: the hook passes locally and CI fails.
  # Must stay below 0.16 for the reason recorded beside that floor.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: '^\.claude/'
        pass_filenames: false
        always_run: true
      - id: ruff-format
        exclude: '^\.claude/'
        pass_filenames: false
        always_run: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: poetry run ty check src/
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: poetry run pytest --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
