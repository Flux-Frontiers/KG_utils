name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dev dependencies
        run: poetry install --only dev --no-interaction

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: typecheck-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        # lancedb only: vector_backend.py's LanceDBBackend still imports it
        # lazily, so ty needs it physically installed to resolve the import,
        # even though it's no longer part of the semantic extra (see pyproject).
        # viz3d-render for the same reason as lancedb: viz3d/organic.py imports
        # pyvista twice — under TYPE_CHECKING for the mesh-builder annotations,
        # and inside _pyvista() behind a try/except — so ty needs it installed to
        # resolve either, and without it tree_mesh, leaf_glyphs and smooth_paths
        # go unchecked. The plain viz3d extra stays NumPy-only, so layout-only
        # consumers are unaffected.
        run: poetry install --with dev --extras "semantic" --extras "synthesis" --extras "viz" --extras "lancedb" --extras "viz3d-render" --extras "viz3d-qt" --no-interaction

      - name: Run ty
        run: poetry run ty check src/

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: test-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        # viz3d-render carries pyvista, which tests/test_viz3d_povexport.py
        # gates on at module scope. Without it that whole file skipped, so
        # limb_paths, leaf_frames and LEAF_ASPECT — the PyVista-free accessors
        # the POV-Ray consumers are built on — had no CI coverage at all and
        # viz3d/organic.py sat at 58%. `lancedb` is deliberately absent: the
        # vector-backend tests no longer require it (see that file's docstring),
        # and adding it back would only re-cover the legacy LanceDB store.
        run: >-
          poetry install --with dev
          --extras "semantic" --extras "synthesis" --extras "viz"
          --extras "viz3d-render" --extras "viz3d-qt"
          --no-interaction

      - name: Run tests
        # offscreen lets the viz3d-qt suite construct QApplication/QWidgets
        # on a runner with no display; without it those tests abort Qt.
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -m "not integration"
