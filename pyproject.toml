# pyproject.toml — kgmodule-utils: shared SDK layer for the KGModule ecosystem
#
# The core install is zero-dependency (stdlib only):
#   kg_utils.specs     — NodeSpec, EdgeSpec, KGExtractor, etc.
#   kg_utils.snapshots — Snapshot, SnapshotManager, SnapshotManifest, etc.
#   kg_utils.store     — SQLite-backed GraphStore
#   kg_utils.module    — KGModule pipeline base
#
# Everything heavier is behind an extra: semantic, lancedb, sqlite-vec, viz,
# viz3d, viz3d-render, synthesis, synthesis-mflux (see
# [project.optional-dependencies] below).

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "kgmodule-utils"
version = "0.12.1"
description = "Shared types, graph store, semantic index, and pipeline base for the KGModule SDK"
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "kgmodule", "sdk", "types", "snapshots"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
# The embedding stack plus the default ("auto") backend, sqlite-vec. Does NOT
# include lancedb — vector_backend.py's own docstring scopes lancedb to
# LanceDBBackend only, and auto_resolve_backend() picks sqlite-vec for every
# fresh or already-migrated store, falling back to lancedb only when an
# un-migrated LanceDB store is already on disk. No adapter in the fleet uses
# LanceDBBackend directly (pycode_kg imports SqliteVecBackend explicitly; doc_kg
# declares lancedb as its own direct dependency rather than getting it from
# here), so bundling it into every `semantic` install was pure dead weight —
# see the lancedb extra below for the un-migrated-store case.
semantic = [
    "numpy>=1.24.0",
    "rich>=13.0.0,<15.0.0",
    "sentence-transformers>=5.4.1",
    "sqlite-vec==0.1.9",
    "torch>=2.5.1",
    "transformers>=5.5.0,<6",
]
# Shared graph rendering (kg_utils.viz).  Kept out of the core so the
# zero-dependency install stays zero-dependency.
viz = [
    "pyvis>=0.3.2",
]
# Shared 3-D layout (kg_utils.viz3d).  Pure numpy: the layouts return
# coordinates and draw nothing, so the heavy renderer stack (pyvista, Qt) stays
# in whichever module actually opens a window.  pycode_kg takes this in its main
# dependencies purely for the layouts and keeps pyvista in its own viz3d extra, so
# adding a renderer here would undo that split for every pycode-kg install — see
# viz3d-render.
viz3d = [
    "numpy>=1.24.0",
]
# The same layouts plus the renderer they need to produce geometry.
# `viz3d` deliberately cannot build a mesh: smooth_paths(), tree_mesh() and
# leaf_glyphs() import pyvista lazily and raise a ModuleNotFoundError naming the
# install when it is absent.  That keeps VTK out of the layout-only consumers,
# but it left pyvista — a genuine runtime dependency of three shipped functions
# — declared in no extra at all, so every caller hand-assembled it and CI had to
# install it by hand for `ty` to resolve the import.  Depend on this extra when
# you intend to render; depend on `viz3d` when you only want coordinates.
viz3d-render = [
    "numpy>=1.24.0",
    "pyvista>=0.44.0",
]
# Exact pin: sqlite-vec is pre-1.0, breaking minors are possible. Prebuilt
# wheels ship for macOS (x86_64 + arm64), Linux (x86_64 + aarch64), and Windows
# (amd64) — no compile step. Also bundled in the `semantic` extra since "auto"
# defaults to sqlite-vec.
sqlite-vec = [
    "sqlite-vec==0.1.9",
]
# LanceDBBackend only. Needed to read/migrate a pre-existing, un-migrated
# LanceDB store — auto_resolve_backend() falls back to this when one is found
# on disk. Not part of `semantic`; opt in explicitly if you have legacy data.
lancedb = [
    "lancedb>=0.19.0",
]
synthesis = [
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pillow>=10.0.0",
]
synthesis-mflux = [
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pillow>=10.0.0",
    "mflux>=0.9.0",
]

[project.urls]
Repository = "https://github.com/Flux-Frontiers/kg_utils"

[tool.poetry]
packages = [{include = "kg_utils", from = "src"}]

# Cross-KG sibling packages (doc-kg, pycode-kg, agent-kg, kg-rag) are NOT
# declared here. They are never imported by this package, and listing them
# forces poetry's universal resolution to reconcile the transformers pin of
# every *published* sibling against this project's own -- a deadlock, since
# doc-kg and pycode-kg each depend on the other. Install them by hand:
#   pip install doc-kg pycode-kg   kg-rag agent-kg       # on PyPI

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest     = ">=9.0.3"
pytest-cov = "^5.0.0"
black      = ">=22.0"
# Capped below 0.16 deliberately. 0.16 expanded the default rule set (38 new
# findings here, several needing judgement rather than autofix) and began
# formatting Python inside Markdown code blocks, rewriting hand-aligned doc
# examples. Both are real upgrades to adopt on purpose, not side effects a
# lock regeneration should smuggle in mid-release. Lift the cap in its own
# change.
ruff       = ">=0.4.0,<0.16"
ty         = ">=0.0.41"
# `.pre-commit-config.yaml` and `.secrets.baseline` were both already checked
# in, but neither tool was installable from this group, so `poetry install
# --with dev` gave you the config without the thing that runs it. CI has no
# detect-secrets job either, so the hook only ever guarded developers who had
# installed pre-commit by some other route. Versions match KGRAG's dev group.
pre-commit = "^4.5.1"
# Not needed to *run* the hook — pre-commit builds its own env for that — but
# required to regenerate `.secrets.baseline` by hand after an audited change.
detect-secrets = "^1.5.0"

[tool.black]
line-length    = 100
target-version = ["py312", "py313"]

[tool.ruff]
line-length    = 100
target-version = "py312"

# Pinned explicitly, matching KGRAG. Without a `select` this project inherited
# ruff's *default* rule set, so the enforced rules changed whenever ruff did —
# which is exactly how 0.16 arrived carrying 38 new findings. With the set named
# here, a version bump can change how existing rules behave but can no longer
# silently add new ones.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "PLC"]
ignore = [
  "E501",      # line length is the formatter's business, not the linter's
  # Lazy imports are this package's architecture, not an oversight: the core
  # install is deliberately zero-dependency, so numpy, torch, sentence-
  # transformers and sqlite_vec are imported inside the functions that need
  # them. Hoisting them to module scope would break that guarantee outright.
  "PLC0415",   # import-outside-top-level (34 sites)
  "BLE001",    # blind-except — intentional at optional-dependency boundaries
  # The three below are real findings, deliberately deferred rather than
  # silently accepted. Each needs its own change, because each is a behaviour
  # question rather than a formatting one:
  #   B905  — 12 `zip()` calls with no `strict=`. `strict=True` would raise on
  #           ragged input where today it truncates; that needs per-call review.
  #   UP042 — `str, Enum` -> `StrEnum` changes what `str(member)` returns
  #           ("TextBackend.OMLX" becomes "omlx"), which callers may depend on.
  #   B027  — `KGModule._post_build_hook` is an intentional optional no-op;
  #           marking it @abstractmethod would break every subclass that does
  #           not override it.
  "B905",
  "UP042",
  "B027",
]

[tool.pylint.main]
source-roots = ["src"]
init-hook = "import sys; sys.path.insert(0, 'src')"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
]
