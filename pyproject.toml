# kgmodule-utils — shared SDK layer for the KGModule ecosystem.
# The core install (specs, snapshots, store, module) is zero-dependency;
# everything heavier lives behind an extra ([project.optional-dependencies]).
# poetry install --with dev --all-extras

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "kgmodule-utils"
version = "0.16.0"
description = "Shared types, graph store, semantic index, and pipeline base for the KGModule SDK"
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "kgmodule", "sdk", "types", "snapshots"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
# Embedding stack plus the default ("auto") backend, sqlite-vec. Deliberately
# excludes lancedb: no fleet adapter uses LanceDBBackend directly, so bundling
# it here was dead weight — see the `lancedb` extra for legacy stores.
semantic = [
    "numpy>=1.24.0",
    "rich>=13.0.0,<15.0.0",
    "sentence-transformers>=5.4.1",
    "sqlite-vec==0.1.9",
    "torch>=2.5.1",
    "transformers>=5.5.0,<6",
]
# Shared graph rendering (kg_utils.viz); kept out of core to stay zero-dependency.
viz = [
    "pyvis>=0.3.2",
]
# Shared 3-D layouts (kg_utils.viz3d). Pure numpy — returns coordinates, draws
# nothing. Adding a renderer here would force VTK on every pycode-kg install;
# see viz3d-render.
viz3d = [
    "numpy>=1.24.0",
]
# Layouts plus the renderer: smooth_paths(), tree_mesh() and leaf_glyphs()
# import pyvista lazily. Depend on this to render, on `viz3d` for coordinates.
viz3d-render = [
    "numpy>=1.24.0",
    "pyvista>=0.44.0",
]
# Qt glue for light-field renders (kg_utils.viz3d.qt): the POV-Ray worker
# thread, its progress/cleanup lifecycle, and the cast path. Qt cannot be
# imported lazily the way organic.py imports pyvista — these classes subclass
# QThread/QDialog/QObject, so the base class must exist at import time. Hence
# a separate module behind a separate extra, and no re-export from viz3d.
viz3d-qt = [
    "numpy>=1.24.0",
    "pyvista>=0.44.0",
    "PyQt5>=5.15.0",
    "quiltwright>=0.6.0",
]
# Exact pin: pre-1.0, breaking minors possible. Prebuilt wheels everywhere;
# also bundled in `semantic` since "auto" defaults to sqlite-vec.
sqlite-vec = [
    "sqlite-vec==0.1.9",
]
# LanceDBBackend only, for reading/migrating a legacy un-migrated LanceDB
# store. Not part of `semantic`; opt in explicitly.
lancedb = [
    "lancedb>=0.19.0",
]
synthesis = [
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pillow>=10.0.0",
]
synthesis-mflux = [
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pillow>=10.0.0",
    "mflux>=0.9.0",
]

[project.urls]
Repository = "https://github.com/Flux-Frontiers/kg_utils"

[tool.poetry]
packages = [{include = "kg_utils", from = "src"}]

# Cross-KG siblings (doc-kg, pycode-kg, agent-kg, kg-rag) are deliberately not
# declared: never imported here, and listing them deadlocks poetry's resolver
# (doc-kg and pycode-kg depend on each other). Install them by hand from PyPI.

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest     = ">=9.0.3"
pytest-cov = "^5.0.0"
# Capped below 0.16 deliberately: 0.16 expands the default rules and reformats
# Python in Markdown blocks. Adopt on purpose; lift the cap in its own change.
ruff       = ">=0.4.0,<0.16"
ty         = ">=0.0.41"
# Makes the checked-in hook config runnable from `poetry install --with dev`.
# Versions match KGRAG's dev group.
pre-commit = "^4.5.1"
# Only needed to regenerate `.secrets.baseline` by hand after an audited change.
detect-secrets = "^1.5.0"

[tool.ruff]
line-length    = 100
target-version = "py312"

# Explicit select (matching KGRAG) so a ruff upgrade can't silently add rules.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "PLC"]
ignore = [
  "E501",      # line length is the formatter's business, not the linter's
  "PLC0415",   # lazy imports ARE the architecture: core install is zero-dependency
  "BLE001",    # blind-except — intentional at optional-dependency boundaries
  # Real findings, deferred — each is a behaviour change needing its own review:
  "B905",      # zip() strict= would raise where today it truncates
  "UP042",     # StrEnum changes str(member) output, which callers may rely on
  "B027",      # _post_build_hook is an intentional optional no-op
]

[tool.pylint.main]
source-roots = ["src"]
init-hook = "import sys; sys.path.insert(0, 'src')"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
]
