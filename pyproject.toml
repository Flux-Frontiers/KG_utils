# pyproject.toml — kgmodule-utils: shared SDK layer for the KGModule ecosystem
#
# The core install is zero-dependency (stdlib only):
#   kg_utils.specs     — NodeSpec, EdgeSpec, KGExtractor, etc.
#   kg_utils.snapshots — Snapshot, SnapshotManager, SnapshotManifest, etc.
#   kg_utils.store     — SQLite-backed GraphStore
#   kg_utils.module    — KGModule pipeline base
#
# Everything heavier is behind an extra: semantic, lancedb, sqlite-vec, viz,
# viz3d, synthesis, synthesis-mflux (see [project.optional-dependencies] below).

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "kgmodule-utils"
version = "0.12.1"
description = "Shared types, graph store, semantic index, and pipeline base for the KGModule SDK"
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "kgmodule", "sdk", "types", "snapshots"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
# The embedding stack plus the default ("auto") backend, sqlite-vec. Does NOT
# include lancedb — vector_backend.py's own docstring scopes lancedb to
# LanceDBBackend only, and auto_resolve_backend() picks sqlite-vec for every
# fresh or already-migrated store, falling back to lancedb only when an
# un-migrated LanceDB store is already on disk. No adapter in the fleet uses
# LanceDBBackend directly (pycode_kg imports SqliteVecBackend explicitly; doc_kg
# declares lancedb as its own direct dependency rather than getting it from
# here), so bundling it into every `semantic` install was pure dead weight —
# see the lancedb extra below for the un-migrated-store case.
semantic = [
    "numpy>=1.24.0",
    "rich>=13.0.0,<15.0.0",
    "sentence-transformers>=5.4.1",
    "sqlite-vec==0.1.9",
    "torch>=2.5.1",
    "transformers>=5.5.0,<6",
]
# Shared graph rendering (kg_utils.viz).  Kept out of the core so the
# zero-dependency install stays zero-dependency.
viz = [
    "pyvis>=0.3.2",
]
# Shared 3-D layout (kg_utils.viz3d).  Pure numpy: the layouts return
# coordinates and draw nothing, so the heavy renderer stack (pyvista, Qt) stays
# in whichever module actually opens a window.
viz3d = [
    "numpy>=1.24.0",
]
# Exact pin: sqlite-vec is pre-1.0, breaking minors are possible. Prebuilt
# wheels ship for macOS (x86_64 + arm64), Linux (x86_64 + aarch64), and Windows
# (amd64) — no compile step. Also bundled in the `semantic` extra since "auto"
# defaults to sqlite-vec.
sqlite-vec = [
    "sqlite-vec==0.1.9",
]
# LanceDBBackend only. Needed to read/migrate a pre-existing, un-migrated
# LanceDB store — auto_resolve_backend() falls back to this when one is found
# on disk. Not part of `semantic`; opt in explicitly if you have legacy data.
lancedb = [
    "lancedb>=0.19.0",
]
synthesis = [
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pillow>=10.0.0",
]
synthesis-mflux = [
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pillow>=10.0.0",
    "mflux>=0.9.0",
]

[project.urls]
Repository = "https://github.com/Flux-Frontiers/kg_utils"

[tool.poetry]
packages = [{include = "kg_utils", from = "src"}]

# Cross-KG sibling packages (doc-kg, pycode-kg, agent-kg, kg-rag) are NOT
# declared here. They are never imported by this package, and listing them
# forces poetry's universal resolution to reconcile the transformers pin of
# every *published* sibling against this project's own -- a deadlock, since
# doc-kg and pycode-kg each depend on the other. Install them by hand:
#   pip install doc-kg pycode-kg   kg-rag agent-kg       # on PyPI

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest     = ">=9.0.3"
pytest-cov = "^5.0.0"
black      = ">=22.0"
ruff       = ">=0.4.0"
ty         = ">=0.0.41"

[tool.black]
line-length    = 100
target-version = ["py312", "py313"]

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.pylint.main]
source-roots = ["src"]
init-hook = "import sys; sys.path.insert(0, 'src')"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
]
